services:
  db:
    image: postgres:16
    container_name: postgres16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inventory_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis7
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: [ "redis-server", "--save", "60", "1", "--loglevel", "warning" ]
    volumes:
      - redis_data:/data

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: ims-seaweedfs
    restart: unless-stopped
    environment:
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
    entrypoint: >
      /bin/sh -c "
      mkdir -p /etc/seaweedfs &&
      printf '{\"identities\":[{\"name\":\"admin\",\"credentials\":[{\"accessKey\":\"%s\",\"secretKey\":\"%s\"}],\"actions\":[\"Admin\",\"Read\",\"Write\"]}]}' \"$$STORAGE_ACCESS_KEY\" \"$$STORAGE_SECRET_KEY\" > /etc/seaweedfs/s3.json &&
      weed server -ip=seaweedfs -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json -s3.port=8333
      "
    volumes:
      - seaweedfs_data:/data
    ports:
      - "8333:8333"
      - "9333:9333"
      - "8888:8888"

  seaweedfs-init:
    image: chrislusf/seaweedfs:latest
    container_name: ims-seaweedfs-init
    environment:
      STORAGE_BUCKET: ${STORAGE_BUCKET}
    depends_on:
      - seaweedfs
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for SeaweedFS...' &&
      until echo 's3.bucket.list' | weed shell -master=seaweedfs:9333 > /dev/null 2>&1; do
        sleep 2;
      done &&
      echo \"s3.bucket.create -name $$STORAGE_BUCKET\" | weed shell -master=seaweedfs:9333 &&
      echo 'SeaweedFS bucket ready.'
      "

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data: