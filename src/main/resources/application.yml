spring:
  application:
    name: inventory-management-backend
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  messages:
    basename: email-messages
    encoding: UTF-8

  datasource:
    url: jdbc:postgresql://localhost:5432/inventory_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    properties:
      hibernate.format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  mail:
    host: ${EMAIL_HOST:localhost}
    port: ${EMAIL_PORT:1025}
    username: ${EMAIL_USERNAME:}
    password: ${EMAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${EMAIL_SMTP_AUTH:false}
          connectiontimeout: ${EMAIL_SMTP_CONNECTION_TIMEOUT_MS:10000}
          timeout: ${EMAIL_SMTP_TIMEOUT_MS:10000}
          writetimeout: ${EMAIL_SMTP_WRITE_TIMEOUT_MS:10000}
          starttls:
            enable: ${EMAIL_SMTP_STARTTLS:false}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 2000
#Redis config
redis:
  session:
    ttl-minutes: ${REDIS_SESSION_TTL_MINUTES:8}
#Logging config
logging:
  level:
    org:
      springframework:
        web: DEBUG
      servlet:
        DispatcherServlet: DEBUG
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized
#App config
app:
  outbox:
    encryption-secret: ${OUTBOX_ENCRYPTION_SECRET:}
    publisher-enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
    publish-interval-ms: ${OUTBOX_PUBLISH_INTERVAL_MS:1000}
    publish-batch-size: ${OUTBOX_PUBLISH_BATCH_SIZE:50}
    publish-confirm-timeout-ms: ${OUTBOX_PUBLISH_CONFIRM_TIMEOUT_MS:10000}
    publish-lease-seconds: ${OUTBOX_PUBLISH_LEASE_SECONDS:120}
    max-attempts: ${ASYNC_MAX_ATTEMPTS:5}
    retry-delay-ms: ${ASYNC_RETRY_DELAY_MS:3000}
  mail:
    from: ${EMAIL_FROM:noreply@example.com}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://192.168.1.117:3001}
  security:
    secure-cookie: ${SECURE_HTTP}
#JWT config
    jwt:
      secret: ${JWT_SECRET}
      access-expiration-time: ${ACCESS_TOKEN_EXPIRY}
      refresh-expiration-time: ${REFRESH_TOKEN_EXPIRY}
      access-cookie-name: ${ACCESS_TOKEN_COOKIE_NAME:access_token}
      refresh-cookie-name: ${REFRESH_TOKEN_COOKIE_NAME:refresh_token}
#S3 config
  storage:
    bucket: ${STORAGE_BUCKET}
    endpoint: ${STORAGE_ENDPOINT}
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:${STORAGE_ENDPOINT}}
    region: ${STORAGE_REGION}
    access-key: ${STORAGE_ACCESS_KEY}
    secret-key: ${STORAGE_SECRET_KEY}
